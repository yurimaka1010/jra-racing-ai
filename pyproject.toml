[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jra-racing-ai"
version = "0.2.0"
description = "Local read-only JRA audit, LightGBM and win-only hypothetical simulation"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
ml = ["numpy>=1.26,<3", "pandas>=2.2,<3", "lightgbm>=4.3,<5", "scikit-learn>=1.4,<2"]

[tool.setuptools.packages.find]
where = ["src"]
